databases:
  - name: rotar-db
    plan: free
    databaseName: rotar
    user: rotar

services:
  - type: web
    name: rotar-hesaplayici
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rotar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
