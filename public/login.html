<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — Rötar Hesaplayıcı</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#16202a; --muted:#6b7785; --line:#d9dfe5; --accent:#2f7df6; --err:#d63b3b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141a; --card:#171e26; --text:#e8edf2; --muted:#8a96a3; --line:#2a343f; --accent:#4d94ff; --err:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font:inherit; color:var(--text); background:transparent;
          border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { width:100%; margin-top:22px; padding:12px; font:inherit; font-weight:600; color:#fff;
           background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:20px; margin-top:12px; color:var(--err); font-size:14px; }
</style>
</head>
<body>
<form id="f">
  <h1>Rötar Hesaplayıcı</h1>
  <p class="sub">Devam etmek için giriş yap.</p>
  <label for="u">Kullanıcı adı</label>
  <input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label for="p">Şifre</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Giriş yap</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
  const f = document.getElementById("f"), e = document.getElementById("e"), b = document.getElementById("b");
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    e.textContent = ""; b.disabled = true;
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = "/"; return; }
      e.textContent = d.error || "Giriş başarısız";
    } catch { e.textContent = "Bağlantı hatası, tekrar dene."; }
    b.disabled = false;
  });
</script>
</body>
</html>
